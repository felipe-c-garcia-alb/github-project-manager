<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repository · GitHub Project Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1 id="title">Repository</h1>
    <div id="message" class="message" hidden></div>

    <div class="columns">
      <section class="block" id="pulls-block">
        <div class="block-header">
          <h2>Pull requests</h2>
          <select id="pr-state" aria-label="Pull request state">
            <option value="open">Open</option>
            <option value="closed">Closed</option>
            <option value="all">All</option>
          </select>
        </div>
        <ul id="pulls" class="list"></ul>
      </section>

      <section class="block" id="branches-block">
        <div class="block-header">
          <h2>Branches</h2>
          <button type="button" id="branches-refresh">Refresh</button>
        </div>
        <form id="create-branch" class="inline" style="margin-bottom:12px">
          <input id="branch-name" placeholder="new-branch-name" required>
          <label for="branch-from" style="margin:0">from</label>
          <select id="branch-from"></select>
          <button type="submit" class="primary">Create branch</button>
        </form>
        <ul id="branches" class="list"></ul>
      </section>
    </div>

    <section class="block" id="actions-block">
      <div class="block-header">
        <h2>Actions <span id="runs-live" class="live" hidden>live</span></h2>
        <div>
          <a id="trigger-link" class="button" href="actions.html">Trigger a workflow</a>
          <button type="button" id="runs-refresh">Refresh</button>
        </div>
      </div>
      <p class="muted">Expand a run to inspect its jobs and logs. Running workflows are refreshed automatically.</p>
      <div id="runs"></div>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="repo.js"></script>
</body>
</html>
