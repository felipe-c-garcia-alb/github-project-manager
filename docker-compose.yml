# Usage:
#   mkdir -p secrets && openssl rand -base64 32 > secrets/token_encryption_key
#   docker compose up -d --build
#
# Put a TLS-terminating reverse proxy (Traefik, Nginx, Caddy, ...) in front of
# this service, or mount a certificate and set TLS_CERT_FILE / TLS_KEY_FILE.
services:
  github-project-manager:
    build: .
    image: github-project-manager:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      # Host names users type in the browser (comma-separated).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      # Trust X-Forwarded-Proto from the reverse proxy (hop count or IP/CIDR list).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REQUIRE_HTTPS: "true"
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # Uncomment to let the container terminate TLS itself:
      # TLS_CERT_FILE: /run/secrets/tls_cert
      # TLS_KEY_FILE: /run/secrets/tls_key
    volumes:
      - gpm-data:/data
    secrets:
      - token_encryption_key

secrets:
  token_encryption_key:
    file: ./secrets/token_encryption_key

volumes:
  gpm-data:
